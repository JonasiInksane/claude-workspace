<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Workspace</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/flows.css">
  <link rel="stylesheet" href="/css/projects.css">
  <link rel="stylesheet" href="/css/assets.css">
  <link rel="stylesheet" href="/css/images.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img src="/icon.svg" alt="">
        <div>
          <h1>Claude Workspace</h1>
          <p id="rootPath"></p>
        </div>
      </div>
      <!-- main.js adds a button per view (VIEWS) -->
      <nav aria-label="Views"></nav>
      <div class="side-actions">
        <span class="label">Hub</span>
        <button class="btn primary" id="startHub">Start Claude in the hub</button>
        <button class="btn" id="continueHub">Continue last hub session</button>
        <button class="btn ghost" id="openNavigator">Open navigator</button>
      </div>
      <div class="side-foot">
        <span id="toolsInfo"></span>
        <button class="icon-btn" id="refresh" title="Refresh">Refresh</button>
      </div>
    </aside>
    <!-- main.js adds a <section class="view" id="view-<id>"> per view -->
    <main></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/main.js"></script>
</body>
</html>
